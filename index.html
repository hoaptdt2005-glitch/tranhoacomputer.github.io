i cả thế gian."},{id:4,group:"me",groupLabel:"Dành cho Mẹ",text:"Mẹ đã dạy con cách mạnh mẽ như tre ngà trước bão, và dịu dàng như sương sớm mai. Cảm ơn mẹ vì tất cả những đêm thức trắng lo toan mà con vô tâm không nhìn thấy. 20/10 này, con chỉ xin chúc mẹ được sống cho chính mình nhiều hơn, được yêu thương trọn vẹn."},{id:5,group:"me",groupLabel:"Dành cho Mẹ",text:"Dù con đi đâu, làm gì, hình bóng mẹ vẫn là chốn dựa bình yên nhất. Chúc mẹ của con ngày Phụ nữ Việt Nam thật vui, thật khỏe, và biết rằng con luôn tự hào khi được làm con của mẹ, người phụ nữ đảm đang, nhân hậu và kiên cường nhất."},{id:6,group:"me",groupLabel:"Dành cho Mẹ",text:"Mẹ à, thời gian lấy đi của mẹ nhiều thứ, nhưng không lấy được sự tử tế và lòng vị tha vô biên. Ngày 20/10, con chúc mẹ chậm lại một chút, nhìn lại hành trình mẹ đã đi qua và mỉm cười tự hào. Mẹ xứng đáng với tất cả những điều tốt đẹp nhất trên đời."},{id:7,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Kính gửi cô, người đã lặng lẽ gieo chữ, gieo yêu thương và gieo niềm tin cho bao thế hệ học trò. Nhân ngày 20/10, em xin chúc cô luôn khỏe mạnh, giữ mãi ngọn lửa nhiệt huyết trong tim. Mong mỗi buổi đến lớp của cô đều đầy tiếng cười và sự trân trọng."},{id:8,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Cô à, cô có nhớ không, cô đã từng nói rằng mỗi đứa trẻ đều là một bông hoa cần được tưới tắm đúng cách. Chính cô đã tưới tắm chúng em bằng sự kiên nhẫn và bao dung. Chúc cô ngày Phụ nữ Việt Nam thật an nhiên, được yêu mến như cách cô đã yêu thương học trò."},{id:9,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Gửi đến cô giáo của em lời tri ân chân thành nhất. Cô không chỉ dạy chữ, cô dạy cách làm người tử tế. Mong cô luôn bình an, sức khỏe dồi dào, và mọi nỗ lực thầm lặng của cô đều được ghi nhận xứng đáng."},{id:10,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Tháng Mười về, em lại nhớ phấn trắng cô giảng, nhớ bụi phấn vương trên tóc cô. Chúc cô 20/10 thật ngọt ngào, được nghỉ ngơi sau những ngày miệt mài bên giáo án. Cô là bông hoa đẹp nhất trong vườn tri thức mà em từng biết."},{id:11,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Cô kính mến, cảm ơn cô vì đã không bỏ cuộc với đứa học trò nghịch ngợm ngày ấy. Sự dịu dàng nhưng nghiêm khắc của cô đã giúp em trưởng thành. Nhân ngày 20/10, em chúc cô hạnh phúc trọn vẹn trong cả sự nghiệp và cuộc sống."},{id:12,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Cô là người giữ lửa, giữ chữ và giữ cả niềm tin vào điều lành. Chúc cô ngày Phụ nữ Việt Nam ngập tràn hoa thắm và những lời chúc chân thành từ học trò cũ. Mong cô luôn giữ được nụ cười hiền hậu và ánh mắt ấm áp ấy."},{id:13,group:"co_giao",groupLabel:"Dành cho Cô giáo",text:"Gửi cô, đóa hoa tháng Mười bên bảng đen. Chúc cô luôn xinh đẹp, tự tin và được yêu thương. Mong rằng trên hành trình trồng người, cô sẽ luôn gặp được những tâm hồn biết trân trọng tâm huyết mà cô đã trao đi."},{id:14,group:"dong_nghiep",groupLabel:"Dành cho Đồng nghiệp",text:"Chúc mừng 20/10 đồng nghiệp thân mến. Cảm ơn chị vì đã luôn tận tâm, chuyên nghiệp và sẵn sàng hỗ trợ mọi người. Chúc chị luôn tỏa sáng theo cách riêng, công việc hanh thông và mỗi ngày đi làm đều là một ngày vui."},{id:15,group:"dong_nghiep",groupLabel:"Dành cho Đồng nghiệp",text:"Gửi chị, người đồng hành đáng tin cậy. Chị vừa giỏi việc, vừa khéo ứng xử, vừa giữ được sự dịu dàng rất riêng. Nhân ngày Phụ nữ Việt Nam, chúc chị sức khỏe, nhiều năng lượng tích cực và sớm đạt được những mục tiêu mà chị đang theo đuổi."},{id:16,group:"dong_nghiep",groupLabel:"Dành cho Đồng nghiệp",text:"Ngày 20/10, chúc chị luôn giữ được sự tự tin và bản lĩnh nơi công sở, nhưng vẫn được phép mềm mại khi trở về nhà. Mong mọi nỗ lực của chị đều được ghi nhận, mọi ý tưởng đều có cơ hội nở hoa."},{id:17,group:"dong_nghiep",groupLabel:"Dành cho Đồng nghiệp",text:"Chị là minh chứng rằng phụ nữ hiện đại có thể vừa độc lập, vừa ấm áp. Cảm ơn chị vì đã truyền cảm hứng cho cả tập thể. Chúc chị 20/10 thật trọn vẹn, được yêu thương và tôn vinh xứng đáng."},{id:18,group:"dong_nghiep",groupLabel:"Dành cho Đồng nghiệp",text:"Gửi lời chúc đến người đồng nghiệp tuyệt vời. Chúc chị luôn mạnh mẽ khi cần, mềm mại khi muốn, và hạnh phúc theo cách riêng của mình. Mong rằng chị sẽ luôn gặp được những cộng sự tử tế như chính chị."},{id:19,group:"dong_nghiep",groupLabel:"Dành cho Đồng nghiệp",text:"Chúc mừng ngày Phụ nữ Việt Nam. Chúc chị chân cứng đá mềm, đường đi thuận lợi, công việc vừa ý và tinh thần luôn phơi phới. Cảm ơn chị đã làm nơi làm việc này ấm áp hơn rất nhiều."},{id:20,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Em à, cảm ơn em vì đã đến và ở lại, dịu dàng như một buổi sớm tháng Mười. Ngày 20/10, anh chỉ mong em được bình yên, được che chở và được yêu chiều vô điều kiện. Em không cần gồng mình mạnh mẽ, vì đã có anh ở đây."},{id:21,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Gửi em, người con gái anh thương. Chúc em ngày 20/10 thật ngọt ngào, mọi điều dịu dàng nhất trên thế gian này đều tìm đến em. Mong em luôn giữ được nét hồn nhiên, sự chân thành và trái tim biết yêu thương sâu sắc."},{id:22,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Em biết không, từ khi có em, thế giới của anh mềm hơn hẳn. Chúc em 20/10 an yên như tách trà nóng buổi sớm, rực rỡ như tà áo dài lụa đào bay trong gió. Em xứng đáng với tất cả những điều tử tế nhất."},{id:23,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Ngày Phụ nữ Việt Nam, anh muốn nói rằng anh tự hào về em, về cách em cố gắng mỗi ngày, về cách em vẫn yêu đời dù có lúc mệt mỏi. Chúc em luôn khỏe, luôn vui và luôn tin rằng em là món quà quý giá nhất."},{id:24,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Em ơi, đừng quên rằng em cũng cần được yêu chiều. Đã bao lâu rồi em chưa tự thưởng cho mình một ngày thong dong. Nhân dịp 20/10, anh chúc em dám ích kỷ một chút để hạnh phúc, để mỉm cười hồn nhiên như năm 17 tuổi."},{id:25,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Gửi em yêu, chúc em có một ngày 20/10 trọn đầy hoa, quà và lời chúc chân thành. Hơn hết, chúc em cả 364 ngày còn lại đều được đối xử như một đóa hoa, được tưới tắm bằng yêu thương và tự do nở theo mùa của chính mình."},{id:26,group:"nguoi_thuong",groupLabel:"Dành cho Người thương",text:"Em là bình yên sau mỗi ngày dài của anh. Chúc em 20/10 và cả những ngày sau này luôn được là chính em, tự do, rực rỡ và đầy kiêu hãnh. Mong em luôn có đủ can đảm để nói không với điều làm em buồn."},{id:27,group:"ban_be",groupLabel:"Dành cho Bạn bè",text:"Gửi cô bạn thân mến, cảm ơn vì đã luôn ở đó, lắng nghe những câu chuyện vu vơ và chia sẻ cả niềm vui lẫn nỗi buồn. Chúc bạn 20/10 thật rực rỡ, luôn tự tin, tự do và hạnh phúc theo cách riêng của bạn."},{id:28,group:"ban_be",groupLabel:"Dành cho Bạn bè",text:"Chúc mừng ngày Phụ nữ Việt Nam cô gái của tôi. Chúc bạn luôn giữ được sự chân thành, nét hồn nhiên và trái tim ấm áp. Dù ngoài kia có bao nhiêu giông gió, mong bạn vẫn giữ được nụ cười hiền và niềm tin vào điều lành."},{id:29,group:"ban_be",groupLabel:"Dành cho Bạn bè",text:"Bạn à, bạn là minh chứng rằng tình bạn của phụ nữ có thể vừa bền bỉ, vừa dịu dàng. Chúc bạn 20/10 ngập tràn quà và hoa, công việc thuận lợi, tình yêu đong đầy và mọi ước mơ đều có cơ hội nở hoa."},{id:30,group:"ban_be",groupLabel:"Dành cho Bạn bè",text:"Gửi bạn, đóa hoa kiên cường và tử tế. Chúc bạn ngày 20/10 thật vui, đêm thật ngon giấc, và biết rằng bạn luôn xứng đáng với những điều tốt đẹp nhất. Mong bạn luôn rực rỡ theo cách của riêng mình."},{id:31,group:"ban_be",groupLabel:"Dành cho Bạn bè",text:"Chúc bạn của tôi luôn mạnh mẽ khi cần, mềm mại khi muốn. Mong bạn đủ can đảm để từ chối điều làm mình mệt mỏi, và đủ dịu dàng để đón nhận điều làm mình hạnh phúc. 20/10 thật an nhiên nhé."},{id:32,group:"ban_be",groupLabel:"Dành cho Bạn bè",text:"Ngày 20/10, chúc bạn luôn là phiên bản chân thành và đầy ánh sáng của chính mình. Cảm ơn vì đã là bạn, đã cùng tôi đi qua bao mùa nắng mưa. Mong bạn luôn được yêu thương vô điều kiện."},{id:33,group:"tong_quat",groupLabel:"Tổng quát",text:"Nhân ngày Phụ nữ Việt Nam 20/10, xin gửi đến chị lời chúc trân trọng nhất. Chúc chị luôn xinh đẹp, tự tin và tỏa sáng. Mong rằng mọi nỗ lực của chị đều được ghi nhận, mọi ước mơ đều có cơ hội nở hoa và mỗi ngày đều đáng nhớ."},{id:34,group:"tong_quat",groupLabel:"Tổng quát",text:"Chúc mừng ngày 20/10. Chúc chị luôn mạnh khỏe, bình an và hạnh phúc. Cảm ơn chị vì đã mang đến sự dịu dàng, kiên cường và yêu thương cho cuộc đời này. Chị xứng đáng với tất cả những điều tuyệt vời nhất."},{id:35,group:"tong_quat",groupLabel:"Tổng quát",text:"Gửi đến chị, bông hoa của tháng Mười. Chúc chị 20/10 thật ngọt ngào, tràn ngập hoa và lời chúc chân thành. Mong chị luôn giữ được tâm hồn ngọc ngà, trái tim ấm áp và nụ cười rạng rỡ mỗi ngày."},{id:36,group:"tong_quat",groupLabel:"Tổng quát",text:"Ngày 20/10 là dịp để cả đất nước dừng lại nói lời cảm ơn với những người phụ nữ. Cảm ơn chị vì đã dịu dàng, vì đã kiên cường, vì đã khóc rồi lại tự lau nước mắt đứng dậy. Chúc chị luôn được trân trọng."},{id:37,group:"tong_quat",groupLabel:"Tổng quát",text:"Chúc chị ngày Phụ nữ Việt Nam thật vui, thật ý nghĩa. Mong chị luôn có một bờ vai để tựa, một người để thương và một lý do để cười mỗi sớm mai thức dậy. Chúc chị mỗi ngày đều là 20/10, được cưng chiều và yêu thương."},{id:38,group:"tong_quat",groupLabel:"Tổng quát",text:"Gửi ngàn yêu thương đến chị nhân ngày 20/10. Chúc chị sức khỏe dồi dào, công việc hanh thông, mọi ước mơ đều thành hiện thực. Chúc nụ cười của chị mãi là ánh nắng sưởi ấm những người xung quanh."},{id:39,group:"tong_quat",groupLabel:"Tổng quát",text:"Cuối cùng, chúc chị 20/10 và cả những ngày sau này, luôn được là ngọn lửa nhỏ trong căn bếp, là ánh đèn vàng trong đêm mưa, là nơi người ta muốn trở về. Chúc chị bình an, thứ bình an lặng lẽ nở trong tim như đóa sen trắng ngần cuối mùa."}],Gr=[{idx:0,label:"Hong Phan",vi:"Hồng Phấn",dot:"#ff8ab3",color:"pink"},{idx:1,label:"Anh Trang",vi:"Ánh Trăng",dot:"#facc1         @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap');
        :root{ --safe-area-inset-top: env(safe-area-inset-top, 0px); --paper:#fdfcfa; --plum:#2b1a2f; --rose:#8b5a5a; --gold:#c9a86a; --ivory:#f6efe8; }
        *{ font-family: "Be Vietnam Pro", system-ui, sans-serif; }
        .font-serif{ font-family: "Cormorant Garamond", "Playfair Display", serif; }
        .font-serif2{ font-family: "Playfair Display", serif; }
        @keyframes flower-draw{ 0%{ stroke-dashoffset: 220; opacity:0 } 100%{ stroke-dashoffset: 0; opacity:1 } }
        @keyframes float{ 0%,100%{ transform: translateY(0) rotate(-0.5deg) } 50%{ transform: translateY(-6px) rotate(0.5deg) } }
        @keyframes aura-pulse{ 0%,100%{ transform: scale(0.94); opacity:0.35 } 50%{ transform: scale(1.06); opacity:0.55 } }
        @keyframes gift-shake{ 0%{ transform: translateX(0) } 20%{ transform: translateX(-6px) } 40%{ transform: translateX(6px) } 60%{ transform: translateX(-4px) } 80%{ transform: translateX(4px) } 100%{ transform: translateX(0) } }
        @keyframes light-sweep{ 0%{ transform: translateX(-120%) skewX(-16deg) } 100%{ transform: translateX(220%) skewX(-16deg) } }
        @keyframes blink{ 0%,50%{ opacity:1 } 51%,100%{ opacity:0 } }
        @keyframes loading-fade{ 0%{ opacity:1 } 100%{ opacity:0; transform: scale(1.02) } }
        @keyframes petal-wiggle{ 0%,100%{ transform: rotate(0deg) } 50%{ transform: rotate(1deg) } }
        .animate-float{ animation: float 4s ease-in-out infinite; }
        .animate-aura{ animation: aura-pulse 3s ease-in-out infinite; }
        .animate-shake{ animation: gift-shake 0.5s ease both; }
        .petal-wiggle{ animation: petal-wiggle 3.5s ease-in-out infinite; }
        .type-cursor::after{ content:"|"; margin-left:2px; animation: blink 0.9s step-end infinite; color: var(--rose); }
        .gift-box{ width:134px; height:134px; position:relative; cursor:pointer; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s, opacity 0.3s; }
        @media(min-width:768px){ .gift-box{ width:168px; height:168px; } }
        @media(min-width:1024px){ .gift-box{ width:184px; height:184px; } }
        .gift-box:hover{ transform: translateY(-8px) scale(1.03); filter: brightness(1.04); }
        .gift-box:active{ transform: translateY(-2px) scale(0.98); }
        .gift-shadow{ position:absolute; bottom:-10px; left:12%; right:12%; height:14px; background: radial-gradient(ellipse at center, rgba(43,26,47,0.18) 0%, transparent 70%); filter: blur(5px); }
        .gift-lid{ position:absolute; top:18%; left:0; right:0; height:30%; border-radius:12px; z-index:2; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 16px rgba(43,26,47,0.12); transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1); transform-origin: bottom center; overflow:hidden; }
        .gift-body{ position:absolute; top:26%; left:6%; right:6%; bottom:0; border-radius:10px 10px 14px 14px; z-index:1; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 10px 20px rgba(43,26,47,0.12); overflow:hidden; }
        .gift-box.opening .gift-lid{ transform: translateY(-38px) rotateX(22deg) rotateZ(-8deg); }
        .gift-box.opened{ opacity:0.38; filter: grayscale(0.2); pointer-events:none; }
        .inner-light{ position:absolute; inset:0; background: radial-gradient(80% 60% at 50% 18%, rgba(255,248,180,0.75), rgba(255,230,120,0.25) 42%, transparent 72%); opacity:0; transition: opacity 0.4s; }
        .gift-box.opening .inner-light{ opacity:1; }
        .ribbon-v{ position:absolute; left:50%; transform: translateX(-50%); top:0; bottom:0; width:18px; background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.78)); box-shadow: 0 0 0 1px rgba(255,255,255,0.6) inset; z-index:3; }
        .ribbon-h{ position:absolute; left:0; right:0; top:46%; height:18px; background: linear-gradient(90deg, rgba(255,255,255,0.92), rgba(255,255,255,0.78)); box-shadow: 0 0 0 1px rgba(255,255,255,0.6) inset; z-index:3; }
        .lid-bow{ position:absolute; left:50%; top:-2%; transform: translateX(-50%); width:54%; height:46%; z-index:4; }
        .lid-bow::before, .lid-bow::after{ content:""; position:absolute; top:16%; width:44%; height:70%; background: linear-gradient(145deg, #fff 0%, #f6efe8 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset 0 1px 1px white, 0 3px 10px rgba(43,26,47,0.12); }
        .lid-bow::before{ left:4%; transform: rotate(-14deg); }
        .lid-bow::after{ right:4%; transform: rotate(14deg); }
        .lid-bow i{ position:absolute; left:50%; top:48%; width:18%; height:36%; background: linear-gradient(#fff, #f6efe8); transform: translateX(-50%); border-radius:4px; box-shadow: 0 2px 6px rgba(43,26,47,0.14); }
        .gift-aura{ position:absolute; inset:-18px; border-radius:22px; filter: blur(18px); opacity:0.45; pointer-events:none; }
        .gift-box[data-color="pink"] .gift-lid, .gift-box[data-color="pink"] .gift-body{ background: linear-gradient(135deg, #ff9bbf 0%, #ff7aa6 55%, #e85a87 100%); }
        .gift-box[data-color="gold"] .gift-lid, .gift-box[data-color="gold"] .gift-body{ background: linear-gradient(135deg, #fde68a 0%, #facc15 55%, #d4a72a 100%); }
        .gift-box[data-color="violet"] .gift-lid, .gift-box[data-color="violet"] .gift-body{ background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 55%, #7c5cbf 100%); }
        .gift-box[data-color="pink"] .gift-aura{ background: radial-gradient(60% 60% at 50% 50%, rgba(255,123,166,0.28), transparent 70%); }
        .gift-box[data-color="gold"] .gift-aura{ background: radial-gradient(60% 60% at 50% 50%, rgba(250,204,21,0.26), transparent 70%); }
        .gift-box[data-color="violet"] .gift-aura{ background: radial-gradient(60% 60% at 50% 50%, rgba(167,139,250,0.28), transparent 70%); }
        .gift-label{ position:absolute; left:50%; bottom:-30px; transform: translateX(-50%); font-family:"Cormorant Garamond", serif; font-size:13px; white-space:nowrap; color: #2b1a2f; letter-spacing:0.06em; text-transform: lowercase; opacity:0.7; }
        .sweep{ position:absolute; top:0; bottom:0; width:40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); transform: translateX(-120%) skewX(-16deg); opacity:0; z-index:6; pointer-events:none; }
        .gift-box:hover .sweep{ opacity:1; animation: light-sweep 0.9s ease; }
        .modal-backdrop{ background: rgba(253,252,250,0.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity:0; transition: opacity 0.4s ease; }
        .modal-backdrop.show{ opacity:1; }
        .modal-card{ transform: scale(0.94) translateY(10px); opacity:0; transition: all 0.6s cubic-bezier(0.34,1.56,0.64,1); }
        .modal-card.show{ transform: scale(1) translateY(0); opacity:1; }
        .flip{ perspective: 1200px; }
        .flip-inner{ position:relative; width:100%; height:100%; transform-style: preserve-3d; transition: transform 0.75s cubic-bezier(0.4,0,0.2,1); }
        .flip-inner.flipped{ transform: rotateY(180deg); }
        .flip-front, .flip-back{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
